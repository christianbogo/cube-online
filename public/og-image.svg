<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="30%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1e2433" />
      <stop offset="60%" stop-color="#0f1117" />
      <stop offset="100%" stop-color="#0a0c10" />
    </radialGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f05224" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGlow)" />

  <!-- Subtle grid pattern -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Main Card Container -->
  <g transform="translate(140, 165)">
    <!-- 3x3 Cube Logo (200x200 scale -> 180x180) -->
    <g transform="translate(0, 40)" filter="url(#shadow)">
      <rect x="0" y="0" width="64" height="64" rx="14" fill="#64748b" />
      <rect x="76" y="0" width="64" height="64" rx="14" fill="#64748b" />
      <rect x="152" y="0" width="64" height="64" rx="14" fill="#64748b" />

      <rect x="0" y="76" width="64" height="64" rx="14" fill="#64748b" />
      <rect x="76" y="76" width="64" height="64" rx="14" fill="url(#accentGlow)" />
      <rect x="152" y="76" width="64" height="64" rx="14" fill="#64748b" />

      <rect x="0" y="152" width="64" height="64" rx="14" fill="#64748b" />
      <rect x="76" y="152" width="64" height="64" rx="14" fill="#64748b" />
      <rect x="152" y="152" width="64" height="64" rx="14" fill="#64748b" />
    </g>

    <!-- Typography & Branding -->
    <g transform="translate(280, 50)">
      <!-- Pill Badge -->
      <g transform="translate(0, 0)">
        <rect width="170" height="32" rx="16" fill="#f05224" fill-opacity="0.15" stroke="#f05224" stroke-opacity="0.3" stroke-width="1.5" />
        <circle cx="16" cy="16" r="4" fill="#22c55e" />
        <text x="28" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#f05224" letter-spacing="1">CUBE ONLINE</text>
      </g>

      <!-- Main Title -->
      <text x="0" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="76" font-weight="800" fill="#ffffff" letter-spacing="-1.5">
        Cube Online
      </text>

      <!-- Subtitle -->
      <text x="0" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#94a3b8">
        The modern speedcubing timer &amp; community
      </text>

      <!-- Feature Tags -->
      <g transform="translate(0, 205)" opacity="0.8">
        <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#64748b">
          Real-time Sync  •  Personal Records  •  Community Solves  •  Analytics
        </text>
      </g>
    </g>
  </g>
</svg>