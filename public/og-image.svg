<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Clean White Background -->
  <rect width="1200" height="630" fill="#ffffff" />

  <!-- Subtle clean grid pattern -->
  <g opacity="0.06" stroke="#0f172a" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="6" fill="#f05224" />

  <!-- Main Content Container -->
  <g transform="translate(140, 165)">
    <!-- 3x3 Cube Logo (180x180) -->
    <g transform="translate(0, 30)" filter="url(#shadow)">
      <rect x="0" y="0" width="64" height="64" rx="14" fill="#475569" />
      <rect x="76" y="0" width="64" height="64" rx="14" fill="#475569" />
      <rect x="152" y="0" width="64" height="64" rx="14" fill="#475569" />

      <rect x="0" y="76" width="64" height="64" rx="14" fill="#475569" />
      <rect x="76" y="76" width="64" height="64" rx="14" fill="#f05224" />
      <rect x="152" y="76" width="64" height="64" rx="14" fill="#475569" />

      <rect x="0" y="152" width="64" height="64" rx="14" fill="#475569" />
      <rect x="76" y="152" width="64" height="64" rx="14" fill="#475569" />
      <rect x="152" y="152" width="64" height="64" rx="14" fill="#475569" />
    </g>

    <!-- Typography & Branding -->
    <g transform="translate(280, 45)">
      <!-- Pill Badge -->
      <g transform="translate(0, 0)">
        <rect width="180" height="34" rx="17" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
        <circle cx="18" cy="17" r="4.5" fill="#22c55e" />
        <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#f05224" letter-spacing="1">SPEEDCUBING TIMER</text>
      </g>

      <!-- Main Title -->
      <text x="0" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="76" font-weight="800" fill="#0f172a" letter-spacing="-1.5">
        Cube Online
      </text>

      <!-- Subtitle -->
      <text x="0" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#475569">
        The modern speedcubing timer &amp; community platform
      </text>

      <!-- Feature Tags -->
      <g transform="translate(0, 215)">
        <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#64748b">
          Real-time Cloud Sync  •  Personal Records  •  Community Solves  •  Goals
        </text>
      </g>
    </g>
  </g>
</svg>