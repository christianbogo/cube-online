<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Clean White Background -->
  <rect width="1200" height="630" fill="#ffffff" />

  <!-- Subtle clean grid pattern -->
  <g opacity="0.05" stroke="#0f172a" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Centered Logo + "Cube Online" Text (No extra helping text) -->
  <g transform="translate(216, 225)">
    <!-- 3x3 Cube Logo (180x180) -->
    <g transform="translate(0, 0)" filter="url(#shadow)">
      <rect x="0" y="0" width="52" height="52" rx="12" fill="#475569" />
      <rect x="64" y="0" width="52" height="52" rx="12" fill="#475569" />
      <rect x="128" y="0" width="52" height="52" rx="12" fill="#475569" />

      <rect x="0" y="64" width="52" height="52" rx="12" fill="#475569" />
      <rect x="64" y="64" width="52" height="52" rx="12" fill="#f05224" />
      <rect x="128" y="64" width="52" height="52" rx="12" fill="#475569" />

      <rect x="0" y="128" width="52" height="52" rx="12" fill="#475569" />
      <rect x="64" y="128" width="52" height="52" rx="12" fill="#475569" />
      <rect x="128" y="128" width="52" height="52" rx="12" fill="#475569" />
    </g>

    <!-- Clean Bold "Cube Online" Header Text -->
    <text x="232" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="88" font-weight="800" fill="#0f172a" letter-spacing="-2">
      Cube Online
    </text>
  </g>
</svg>